# Troqo — vhost Apache (reverse proxy vers le serveur du marché sur 127.0.0.1:3200).
# Installé dans /etc/apache2/sites-available/troqo.conf (voir deploy/README.md).
# Certbot (--apache) ajoute ensuite le vhost :443 et la redirection HTTPS à partir de celui-ci.
# troqo.dev est un domaine .dev : les navigateurs n'y vont qu'en HTTPS (HSTS préchargé).

<VirtualHost *:80>
    ServerName TROQO_DOMAIN
    ServerAlias www.TROQO_DOMAIN

    ProxyPreserveHost On
    ProxyRequests Off
    # Validation Let's Encrypt (certbot, renouvellements) : servie par Apache, jamais relayée.
    ProxyPass /.well-known/acme-challenge/ !
    ProxyPass / http://127.0.0.1:3200/
    ProxyPassReverse / http://127.0.0.1:3200/
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

    # Bêta fermée : tout le site et l'API derrière un mot de passe (fichier propre à Troqo).
    # Le client Troqo l'envoie quand l'adresse du serveur le contient : https://user:motdepasse@TROQO_DOMAIN
    <Location />
        AuthType Basic
        AuthName "Troqo - beta fermee"
        AuthUserFile /etc/apache2/.htpasswd-troqo
        Require valid-user
    </Location>
    <Location /.well-known/acme-challenge/>
        Require all granted
    </Location>
    # Surveillance de disponibilité (.github/workflows/uptime.yml) : /health répond {"ok":true}, sans rien d'autre.
    <Location /health>
        Require all granted
    </Location>

    Header always unset X-Powered-By
    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options SAMEORIGIN
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Robots-Tag "noindex, nofollow"

    # Pas de journal d'accès : Troqo n'écrit pas les adresses IP sur disque (voir /legal). Seul le
    # journal d'erreurs reste (adresse incluse en cas d'erreur ou de mot de passe refusé), 14 jours.
    ErrorLog ${APACHE_LOG_DIR}/troqo-error.log
</VirtualHost>
